<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDigital Fintech - Product Knowledge Base</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .search-box button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-tag {
            padding: 8px 15px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .sidebar h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .sidebar li:last-child {
            border-bottom: none;
        }

        .sidebar a {
            color: #666;
            text-decoration: none;
            transition: color 0.3s;
            display: block;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: #667eea;
            font-weight: bold;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .product-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-header h2 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .product-category {
            font-size: 0.9em;
            opacity: 0.9;
            font-weight: 300;
        }

        .product-body {
            padding: 20px;
        }

        .product-description {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .product-variants {
            margin-bottom: 15px;
        }

        .variant-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .variant-item {
            background: #f9f9f9;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-left: 3px solid #667eea;
            border-radius: 3px;
            font-size: 0.85em;
        }

        .market-research {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .market-research h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .market-stat {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.85em;
            color: #555;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: #e8eef7;
            color: #667eea;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .expand-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .expand-btn:hover {
            background: #764ba2;
        }

        .detail-view {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .detail-view.active {
            display: block;
        }

        .detail-view h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .detail-section {
            margin-bottom: 30px;
        }

        .detail-section h3 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .variants-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .variants-table th,
        .variants-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .variants-table th {
            background: #f0f4ff;
            color: #667eea;
            font-weight: bold;
        }

        .variants-table tr:hover {
            background: #f9f9f9;
        }

        .market-chart {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .chart-label {
            min-width: 150px;
            font-weight: bold;
            color: #333;
        }

        .chart-fill {
            flex: 1;
            height: 30px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            margin: 0 15px;
            position: relative;
            overflow: hidden;
        }

        .chart-value {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .close-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            float: right;
            margin-bottom: 20px;
        }

        .close-btn:hover {
            background: #ee5a5a;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .search-box {
                flex-direction: column;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .no-results {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 OneDigital Fintech - Product Knowledge Base</h1>
            <p>May 2026 Reckoner | Comprehensive Product Variants & Market Research</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search products, features, or market data...">
                <button onclick="search()">Search</button>
            </div>
            <div class="filter-tags" id="filterTags"></div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>Categories</h3>
                <ul id="categories"></ul>
            </div>

            <div>
                <div class="content-grid" id="productGrid"></div>
                <div class="detail-view" id="detailView"></div>
            </div>
        </div>
    </div>

    <script>
        // Product Knowledge Base Data
        const productsData = [
            {
                id: 1,
                name: "Digital Payments",
                category: "Payment Solutions",
                description: "Comprehensive digital payment solutions for businesses and consumers",
                variants: [
                    { name: "Mobile Wallet", features: "NFC, QR Code, In-app payments" },
                    { name: "Digital Card", features: "Virtual card, Tokenization, Real-time alerts" },
                    { name: "Payment Gateway", features: "Multi-channel, API integration, Settlement" },
                    { name: "P2P Transfer", features: "Instant transfer, Low fees, 24/7 availability" }
                ],
                marketResearch: {
                    marketSize: "₹2.5 Trillion",
                    growth: "23.4%",
                    penetration: "42% urban, 15% rural",
                    keyPlayers: "Google Pay, PhonePe, Paytm, WhatsApp Pay",
                    trends: ["Buy now pay later", "Cryptocurrency integration", "Voice payments"]
                },
                tags: ["Payment", "Digital", "Mobile", "B2B", "B2C"]
            },
            {
                id: 2,
                name: "Digital Lending",
                category: "Credit Solutions",
                description: "AI-powered lending platform with instant approval and flexible repayment",
                variants: [
                    { name: "Personal Loans", features: "Instant approval, Low interest, Flexible tenure" },
                    { name: "Business Loans", features: "Quick disbursal, Competitive rates, Minimal documentation" },
                    { name: "BNPL Services", features: "Zero interest EMI, Digital onboarding, Real-time eligibility" },
                    { name: "Credit Line", features: "Revolving credit, On-demand access, Dynamic limits" }
                ],
                marketResearch: {
                    marketSize: "₹1.8 Trillion",
                    growth: "35.2%",
                    penetration: "28% in metros, 8% in tier-2",
                    keyPlayers: "Bajaj Finserv, ICICI, Flipkart, Amazon",
                    trends: ["Alternative credit scoring", "Blockchain verification", "Instant settlements"]
                },
                tags: ["Lending", "Credit", "Fintech", "AI", "B2C"]
            },
            {
                id: 3,
                name: "Investment Platform",
                category: "Wealth Management",
                description: "Democratized investment platform for stocks, mutual funds, and crypto",
                variants: [
                    { name: "Stock Trading", features: "Real-time quotes, Zero brokerage, Advanced charting" },
                    { name: "Mutual Funds", features: "Direct plans, SIP automation, Low fees" },
                    { name: "Cryptocurrency", features: "Multi-asset trading, Secure wallet, Cold storage" },
                    { name: "Goal Planning", features: "AI advisor, Portfolio optimization, Risk assessment" }
                ],
                marketResearch: {
                    marketSize: "₹4.2 Trillion",
                    growth: "41.3%",
                    penetration: "35% retail, 22% institutional",
                    keyPlayers: "Zerodha, Upstox, Angel One, ICICI Direct",
                    trends: ["Robo-advisory adoption", "Fractional investing", "ESG focus"]
                },
                tags: ["Investment", "Trading", "Wealth", "Stocks", "Crypto"]
            },
            {
                id: 4,
                name: "Digital Insurance",
                category: "Insurance Tech",
                description: "Simplified insurance products with instant claims and AI underwriting",
                variants: [
                    { name: "Health Insurance", features: "Cashless claims, Telemedicine, Family plans" },
                    { name: "Life Insurance", features: "Quick underwriting, Digital KYC, Flexible tenure" },
                    { name: "General Insurance", features: "Fast claim settlement, IoT integration" },
                    { name: "Micro Insurance", features: "Affordable premiums, Coverage in minutes" }
                ],
                marketResearch: {
                    marketSize: "₹8.5 Trillion",
                    growth: "18.7%",
                    penetration: "3.5% health, 7.2% life",
                    keyPlayers: "ICICI Lombard, HDFC ERGO, Digit, Acko",
                    trends: ["AI underwriting", "Usage-based premiums", "Blockchain claims"]
                },
                tags: ["Insurance", "Health", "HealthTech", "AI", "ClaimTech"]
            },
            {
                id: 5,
                name: "Digital Banking",
                category: "Banking Solutions",
                description: "Full-stack digital banking with accounts, deposits, and lending",
                variants: [
                    { name: "Savings Account", features: "Zero balance, High interest, Instant KYC" },
                    { name: "Current Account", features: "Unlimited transactions, API integration, Payroll" },
                    { name: "Fixed Deposits", features: "Competitive rates, Flexible tenure, Auto-renewal" },
                    { name: "Credit Products", features: "Instant approval, Digital documentation" }
                ],
                marketResearch: {
                    marketSize: "₹32 Trillion",
                    growth: "12.5%",
                    penetration: "80% urban, 45% rural",
                    keyPlayers: "Kotak, ICICI, Axis, RBL, Airtel Payments",
                    trends: ["Open banking", "API-first architecture", "Embedded finance"]
                },
                tags: ["Banking", "Digital", "B2B", "B2C", "Core Banking"]
            },
            {
                id: 6,
                name: "API Marketplace",
                category: "Developer Services",
                description: "Modular fintech APIs for embedded financial services integration",
                variants: [
                    { name: "Payment APIs", features: "Settlement, Webhooks, Global support" },
                    { name: "Lending APIs", features: "Credit assessment, Underwriting, Compliance" },
                    { name: "KYC APIs", features: "Document verification, Biometric, Liveness" },
                    { name: "Reporting APIs", features: "Real-time dashboards, Analytics, Export" }
                ],
                marketResearch: {
                    marketSize: "₹45 Billion",
                    growth: "52.1%",
                    penetration: "15% B2B SaaS adoption",
                    keyPlayers: "Razorpay, BharatPe, Cashfree, PayU",
                    trends: ["Composable architecture", "Low-code platforms", "Real-time APIs"]
                },
                tags: ["API", "Developer", "Integration", "B2B", "SaaS"]
            }
        ];

        // Initialize page
        function init() {
            renderCategories();
            renderProducts(productsData);
            renderFilterTags();
        }

        function renderCategories() {
            const categories = [...new Set(productsData.map(p => p.category))];
            const categoriesList = document.getElementById('categories');
            
            categoriesList.innerHTML = categories.map(cat => 
                `<li><a href="#" onclick="filterByCategory(event, '${cat}')">${cat}</a></li>`
            ).join('');
        }

        function renderFilterTags() {
            const allTags = [...new Set(productsData.flatMap(p => p.tags))];
            const filterTags = document.getElementById('filterTags');
            
            filterTags.innerHTML = allTags.map(tag => 
                `<div class="filter-tag" onclick="filterByTag(event, '${tag}')">${tag}</div>`
            ).join('');
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<div class="no-results">No products found</div>';
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-header">
                        <h2>${product.name}</h2>
                        <div class="product-category">${product.category}</div>
                    </div>
                    <div class="product-body">
                        <div class="product-description">${product.description}</div>
                        
                        <div class="product-variants">
                            <div class="variant-label">📦 Key Variants:</div>
                            ${product.variants.slice(0, 2).map(v => 
                                `<div class="variant-item">${v.name}</div>`
                            ).join('')}
                            ${product.variants.length > 2 ? 
                                `<div class="variant-item" style="color: #999;">+${product.variants.length - 2} more variants</div>` 
                                : ''
                            }
                        </div>

                        <div class="market-research">
                            <h4>📈 Market Data</h4>
                            <div class="market-stat">
                                <span>Market Size:</span>
                                <span class="stat-value">${product.marketResearch.marketSize}</span>
                            </div>
                            <div class="market-stat">
                                <span>Growth Rate:</span>
                                <span class="stat-value">${product.marketResearch.growth}</span>
                            </div>
                        </div>

                        <div class="tags">
                            ${product.tags.slice(0, 3).map(tag => 
                                `<span class="tag">${tag}</span>`
                            ).join('')}
                        </div>

                        <button class="expand-btn" onclick="showDetails(${product.id})">View Full Details →</button>
                    </div>
                </div>
            `).join('');
        }

        function showDetails(productId) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return;

            const detailView = document.getElementById('detailView');
            
            detailView.innerHTML = `
                <button class="close-btn" onclick="closeDetails()">✕ Close</button>
                
                <h2>${product.name}</h2>
                
                <div class="detail-section">
                    <h3>📝 Overview</h3>
                    <p>${product.description}</p>
                </div>

                <div class="detail-section">
                    <h3>📦 Product Variants</h3>
                    <table class="variants-table">
                        <thead>
                            <tr>
                                <th>Variant Name</th>
                                <th>Key Features</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${product.variants.map(variant => `
                                <tr>
                                    <td><strong>${variant.name}</strong></td>
                                    <td>${variant.features}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="detail-section">
                    <h3>📊 Market Research & Analysis</h3>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                        <div>
                            <strong>Market Metrics:</strong>
                            <div class="market-chart">
                                <div class="chart-bar">
                                    <div class="chart-label">Market Size</div>
                                    <div class="chart-fill">
                                        <div class="chart-value">${product.marketResearch.marketSize}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <strong>Growth Trajectory:</strong>
                            <div class="market-chart">
                                <div class="chart-bar">
                                    <div class="chart-label">YoY Growth</div>
                                    <div class="chart-fill" style="width: ${Math.min(product.marketResearch.growth.replace('%', ''), 100)}%;">
                                        <div class="chart-value">${product.marketResearch.growth}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <strong>Market Penetration:</strong>
                        <p style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                            ${product.marketResearch.penetration}
                        </p>
                    </div>

                    <div style="margin-top: 20px;">
                        <strong>Key Players:</strong>
                        <p style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                            ${product.marketResearch.keyPlayers}
                        </p>
                    </div>

                    <div style="margin-top: 20px;">
                        <strong>🔮 Market Trends:</strong>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            ${product.marketResearch.trends.map(trend => 
                                `<li style="margin-bottom: 8px;">${trend}</li>`
                            ).join('')}
                        </ul>
                    </div>
                </div>

                <div class="detail-section">
                    <h3>🏷️ Tags & Categories</h3>
                    <div class="tags" style="gap: 12px;">
                        ${product.tags.map(tag => 
                            `<span class="tag">${tag}</span>`
                        ).join('')}
                    </div>
                </div>
            `;

            detailView.classList.add('active');
            document.getElementById('productGrid').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeDetails() {
            const detailView = document.getElementById('detailView');
            detailView.classList.remove('active');
            document.getElementById('productGrid').style.display = 'grid';
        }

        function search() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            if (!query) {
                renderProducts(productsData);
                return;
            }

            const filtered = productsData.filter(product => 
                product.name.toLowerCase().includes(query) ||
                product.description.toLowerCase().includes(query) ||
                product.tags.some(tag => tag.toLowerCase().includes(query)) ||
                product.variants.some(v => v.name.toLowerCase().includes(query))
            );

            renderProducts(filtered);
        }

        function filterByCategory(event, category) {
            event.preventDefault();
            const filtered = productsData.filter(p => p.category === category);
            renderProducts(filtered);
            closeDetails();
        }

        function filterByTag(event, tag) {
            event.target.classList.toggle('active');
            const activeTags = Array.from(document.querySelectorAll('.filter-tag.active'))
                .map(tag => tag.textContent);
            
            if (activeTags.length === 0) {
                renderProducts(productsData);
            } else {
                const filtered = productsData.filter(p => 
                    activeTags.some(tag => p.tags.includes(tag))
                );
                renderProducts(filtered);
            }
            closeDetails();
        }

        // Search on Enter
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') search();
            });
        });

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
